[project]
name = "competitorbreak"
version = "0.1.0"
description = "Competitor blog keyword intelligence via scraping + SQLite"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "click>=8.1",
    "rich>=13.7",
]

[project.scripts]
cb = "competitorbreak.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
